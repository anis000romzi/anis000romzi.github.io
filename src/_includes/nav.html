<!--
  NAV: the navigation links, written once.
  Any page or layout can paste this in with:  include "nav.html"
  (wrapped in curly brace + percent). Used in index.html and base.html.
-->

    <li><a href="/about/" {% if page.url == "/about/" %}aria-current="page"{% endif %}>About Me</a></li>

    <li><a href="/projects/" {% if page.url == "/projects/" %}aria-current="page"{% endif %}>Projects</a></li>
    <li><a href="/blogs/" {% if page.url == "/blogs/" %}aria-current="page"{% endif %}>Blogs</a></li>
    <li><a href="/etc/" {% if page.url.startsWith("/etc/") %}aria-current="page"{% endif %}>Etc.</a></li>
  </ul>
</nav>
